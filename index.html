<!DOCTYPE html>
<!-- Linea for sustaining instrument. Composed and designed by Rob Casey. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linea for sustaining instrument</title>
  <meta name="author" content="Rob Casey">
  <meta name="description" content="Linea for sustaining instrument: an animated score for a sustaining instrument and sine tones, composed and designed by Rob Casey.">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body data-theme="light">
  <canvas id="score"></canvas>

  <div id="bar">
    <button id="play" class="primary" title="Space">Play</button>
    <button id="restart" title="Home">From start</button>
    <button id="open-setup" title="S">Setup</button>
    <button id="theme" title="D">Light / dark</button>
    <button id="full" title="F">Fullscreen</button>
  </div>

  <aside id="setup" hidden></aside>

  <!-- Plain scripts, no build step and nothing fetched from the internet:
       double-click this file to run the score. -->
  <script src="js/rng.js?v=12"></script>
  <script src="js/score.js?v=12"></script>
  <script src="js/audio.js?v=12"></script>
  <script src="js/view.js?v=12"></script>
  <script src="js/setup.js?v=12"></script>
  <script src="js/main.js?v=12"></script>
</body>
</html>
